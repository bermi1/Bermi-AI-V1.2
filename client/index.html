    <script>
      // Apply saved appearance before first paint so there is no flash of the
      // wrong theme. Mirrors lib/theme.tsx (same storage key, same attributes).
      try {
        var p = JSON.parse(localStorage.getItem('bermi-prefs') || 'null') || {}
        var mode = p.mode || localStorage.getItem('bermi-theme') || 'system'
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        var h = document.documentElement
        h.dataset.theme = dark ? 'dark' : 'light'
        if (p.accent) h.dataset.accent = p.accent
        if (p.accent === 'custom') {
          var cv = JSON.parse(localStorage.getItem('bermi-custom-vars') || 'null')
          var set = cv && cv[dark ? 'dark' : 'light']
          if (set) for (var k in set) h.style.setProperty(k, set[k])
        }
        if (p.density) h.dataset.density = p.density
        if (p.motion) h.dataset.motion = p.motion
        if (p.textSize) h.dataset.text = p.textSize
      } catch (e) {}
    </script>
